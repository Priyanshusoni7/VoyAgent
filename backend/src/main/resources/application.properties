spring.application.name=voyagent-backend

# Same port the Express backend listened on, so the frontend needs no change.
server.port=${PORT:5000}
server.forward-headers-strategy=framework

# ---------------------------------------------------------------
# MongoDB (same database/collections the previous backend used)
# ---------------------------------------------------------------
spring.data.mongodb.uri=${MONGO_DB_URI}
spring.data.mongodb.auto-index-creation=true

# ---------------------------------------------------------------
# Application
# ---------------------------------------------------------------
app.environment=${NODE_ENV:development}
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration=${JWT_EXPIRATION:7d}
app.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}
# Comma-separated; blanks are ignored. localhost:3000 / 127.0.0.1:3000 are always allowed.
app.allowed-origins=${FRONTEND_URL:},${CLIENT_URL:},${CORS_ORIGIN:}

# ---------------------------------------------------------------
# Local development convenience: read backend/.env when it exists.
# In production, supply these as real environment variables instead.
# ---------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]
